# The URL the site will be built for
base_url = "https://trifectatech.org"

# Whether to automatically compile all Sass files in the sass directory
compile_sass = true

# Whether to build a search index to be used later on by a JavaScript library
build_search_index = false

title = "Trifecta Tech Foundation"
generate_feeds = true
feed_filenames = ["atom-feed.xml", "rss-feed.xml"]

taxonomies = [
    {name = "tags", render = true},
    # {name = "ntpd-rs"},
    # {name = "announcement"},
    # {name = "zlib-rs"},
    # {name = "sudo-rs"},
    # {name = "pendulum"},
    # {name = "statime"},
    # {name = "data-compression"},
    {name = "category", render = false},
    # {name = "infrastructure"},
    # {name = "ecosystem"},
]

[markdown]
# When set to "true", emoji aliases translated to their corresponding
# Unicode emoji equivalent in the rendered Markdown files. (e.g.: :smile: => 😄)
render_emoji = true

# Whether footnotes are rendered in the GitHub-style (at the bottom, with back references) or plain (in the place, where they are defined)
bottom_footnotes = true

[markdown.highlighting]
# Syntax highlighting (Giallo, Zola >= 0.22). Themes: https://github.com/getzola/giallo#built-in
theme = "github-dark"

[extra]
# Put all your custom variables here
